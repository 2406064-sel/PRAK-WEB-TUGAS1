
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f3f6fc;
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1d4ed8, #6366f1);
            color: white;
            padding: 35px 20px;
        }

        .header-content,
        main {
            max-width: 1100px;
            margin: auto;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            color: #e0e7ff;
            line-height: 1.6;
        }

        main {
            padding: 28px 20px 50px;
        }

        .section-title {
            font-size: 21px;
            margin-bottom: 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
            border-left: 4px solid #4f46e5;
        }

        .stat-card p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .stat-card h3 {
            font-size: 27px;
            color: #1e293b;
            overflow-wrap: anywhere;
        }

        .panel {
            background: white;
            padding: 24px;
            border-radius: 14px;
            margin-bottom: 28px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.05);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        input:not([type="checkbox"]),
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background: white;
            color: #1e293b;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
        }

        .checkbox-group input {
            width: 17px;
            height: 17px;
            accent-color: #4f46e5;
        }

        .form-actions {
            margin-top: 22px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(0.96);
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .toolbar input {
            max-width: 360px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .project-card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
            border-top: 4px solid #6366f1;
            overflow-wrap: anywhere;
        }

        .project-card.completed {
            border-top-color: #16a34a;
        }

        .project-card h3 {
            font-size: 19px;
            margin-bottom: 12px;
        }

        .project-category {
            display: inline-block;
            padding: 6px 10px;
            background: #eef2ff;
            color: #4338ca;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 14px;
        }

        .project-info {
            color: #64748b;
            font-size: 14px;
            line-height: 1.9;
            margin-bottom: 16px;
        }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-progress {
            color: #92400e;
            background: #fef3c7;
        }

        .status-completed {
            color: #166534;
            background: #dcfce7;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }

        .btn-status {
            background: #e0e7ff;
            color: #3730a3;
        }

        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
        }

        .empty-state {
            grid-column: 1 / -1;
            background: white;
            padding: 35px 20px;
            text-align: center;
            color: #64748b;
            border-radius: 12px;
            border: 1px dashed #cbd5e1;
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .message.success {
            display: block;
            color: #166534;
            background: #dcfce7;
        }

        .message.error {
            display: block;
            color: #991b1b;
            background: #fee2e2;
        }

        footer {
            text-align: center;
            padding: 22px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            header h1 {
                font-size: 25px;
            }

            .stats {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .form-grid,
            .project-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .toolbar input {
                max-width: none;
            }

            .panel {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-content">
            <h1>Interactive Portfolio Tracker</h1>
            <p>Kelola proyek, pantau anggaran, dan perbarui status
                proyek secara interaktif.</p>
        </div>
    </header>

    <main>
        <section>
            <h2 class="section-title">Ringkasan Portofolio</h2>

            <div class="stats">
                <div class="stat-card">
                    <p>Total Proyek</p>
                    <h3 id="totalProjects">0</h3>
                </div>

                <div class="stat-card">
                    <p>Proyek Selesai</p>
                    <h3 id="completedProjects">0</h3>
                </div>

                <div class="stat-card">
                    <p>Total Anggaran</p>
                    <h3 id="totalBudget">Rp0</h3>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="section-title">Tambah Proyek Baru</h2>

            <form id="projectForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="projectTitle">Judul Proyek</label>
                        <input
                            type="text"
                            id="projectTitle"
                            placeholder="Contoh: Website Toko Online"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="projectCategory">Kategori</label>
                        <select id="projectCategory" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="Web App">Web App</option>
                            <option value="Mobile App">Mobile App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="projectBudget">Estimasi Anggaran (Rp)</label>
                        <input
                            type="number"
                            id="projectBudget"
                            placeholder="Contoh: 5000000"
                            min="1"
                            step="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Status Proyek</label>
                        <div class="checkbox-group">
                            <input
                                type="checkbox"
                                id="projectCompleted"
                            >
                            <label for="projectCompleted">
                                Sudah Selesai
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        + Tambahkan Proyek
                    </button>
                </div>

                <div id="formMessage" class="message"
                    role="status" aria-live="polite"></div>
            </form>
        </section>

        <section>
            <div class="toolbar">
                <h2 class="section-title">Daftar Proyek</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Cari nama proyek..."
                    aria-label="Cari nama proyek"
                >
            </div>

            <div id="projectList" class="project-grid"></div>
        </section>
    </main>

    <footer>
        Interactive Portfolio Tracker &copy; 2026
    </footer>

    <script src="main.js" defer></script>
</body>
</html>
